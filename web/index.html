<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <title>Roni Paschoal - Desenvolvedor Mobile Flutter Sênior</title>
  <meta name="description"
    content="Desenvolvedor mobile Flutter sênior, 8+ anos em software e 5+ em mobile multiplataforma. Apps Android, iOS e SmartPOS, do MVP às lojas. Disponível para remoto.">
  <meta name="author" content="Roni Paschoal">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#07080f">
  <!-- Static so crawlers that don't run JavaScript see them. These are the
       Portuguese home page's values: tool/seo_content.dart rewrites them
       (with the title, descriptions, og:* and lang) for cv.html, en.html
       and en-cv.html, and RpPageMeta keeps them in sync per route once the
       app runs. The canonical URL matches og:url. -->
  <link rel="canonical" href="https://ronipaschoal.com.br/">
  <link rel="alternate" hreflang="pt-BR" href="https://ronipaschoal.com.br/">
  <link rel="alternate" hreflang="en" href="https://ronipaschoal.com.br/en">
  <link rel="alternate" hreflang="x-default" href="https://ronipaschoal.com.br/">

  <!-- Open Graph / Twitter: the preview shown when the link is shared -->
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Roni Paschoal">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:url" content="https://ronipaschoal.com.br/">
  <meta property="og:title" content="Roni Paschoal - Desenvolvedor Mobile Flutter Sênior">
  <meta property="og:description"
    content="Desenvolvedor Flutter sênior: apps Android, iOS e SmartPOS com Dart, BLoC/Cubit, Offline First e CI/CD.">
  <meta property="og:image" content="https://ronipaschoal.com.br/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logotipo de Roni Paschoal ao lado do nome, do cargo Desenvolvedor de Software Mobile Flutter e de Flutter, Dart, Android e iOS">
  <meta property="profile:first_name" content="Roni">
  <meta property="profile:last_name" content="Paschoal">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Roni Paschoal - Desenvolvedor Mobile Flutter Sênior">
  <meta name="twitter:description"
    content="Desenvolvedor Flutter sênior: apps Android, iOS e SmartPOS com Dart, BLoC/Cubit, Offline First e CI/CD.">
  <meta name="twitter:image" content="https://ronipaschoal.com.br/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Roni Paschoal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="manifest" href="manifest.json">

  <script>
    // Links from before the switch to path URLs (`/#/cv`) keep working:
    // turn the hash route into the real path before Flutter reads it.
    if (location.hash.startsWith('#/')) {
      history.replaceState(null, '', location.hash.slice(1));
    }
  </script>

  <!-- Person JSON-LD in the page's language, written at build time by
       tool/seo_content.dart. -->
  <!-- seo-json-ld -->
</head>

<body style="background-color: #07080f;">
  <div class="loader"></div>
  <img class="logo" src="assets/icon.png" alt="" />
  <div class="logo-loader"></div>

  <!-- Filled at build time by tool/seo_content.dart with the résumé as plain
       HTML, for crawlers and link previews that don't run Flutter. Visually
       hidden, and removed once Flutter paints so screen readers don't hear
       the content twice. -->
  <main id="seo-content" class="visually-hidden">
    <!-- seo-content -->
  </main>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var content = document.getElementById('seo-content');
      if (content) content.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      display: flex;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .logo {
      height: 30vh;
      -webkit-filter: drop-shadow(2px 2px #c92f10);
      filter: drop-shadow(2px 2px #c92f10);
    }

    .logo-loader {
      top: 30vh;
      position: absolute;
      width: 30vh;
      background-color: #07080f;
      animation: logoAnimation 4s;
    }

    @keyframes logoAnimation {
      0% {
        height: 30vh;
      }

      100% {
        height: 0;
      }
    }

    .loader {
      position: absolute;
      top: 0;
      left: 0;
      height: 2px;
      width: 0;
      background-color: #c92f10;
      animation: loadingAnimation 3s infinite;
    }

    @keyframes loadingAnimation {

      100% {
        width: 100vw;
      }
    }
  </style>
</body>

</html>
