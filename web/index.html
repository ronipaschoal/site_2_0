  <script>
    // Links from before the switch to path URLs (`/#/cv`) keep working:
    // turn the hash route into the real path before Flutter reads it.
    if (location.hash.startsWith('#/')) {
      history.replaceState(null, '', location.hash.slice(1));
    }

    // Every route is served by this same file, so the canonical URL is set
    // per request rather than hard-coded to the home page.
    (function () {
      var canonical = document.createElement('link');
      canonical.rel = 'canonical';
      canonical.href = location.origin + location.pathname;
      document.head.appendChild(canonical);
    })();
  </script>

  <!-- Filled at build time by tool/seo_content.dart with the résumé as plain
       HTML, for crawlers and link previews that don't run Flutter. Visually
       hidden, and removed once Flutter paints so screen readers don't hear
       the content twice. -->
  <main id="seo-content" class="visually-hidden">
    <!-- seo-content -->
  </main>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var content = document.getElementById('seo-content');
      if (content) content.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      display: flex;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .logo {
      height: 30vh;
      -webkit-filter: drop-shadow(2px 2px #c92f10);
      filter: drop-shadow(2px 2px #c92f10);
    }

    .logo-loader {
      top: 30vh;
      position: absolute;
      width: 30vh;
      background-color: #07080f;
      animation: logoAnimation 4s;
    }

    @keyframes logoAnimation {
      0% {
        height: 30vh;
      }

      100% {
        height: 0;
      }
    }

    .loader {
      position: absolute;
      top: 0;
      left: 0;
      height: 2px;
      width: 0;
      background-color: #c92f10;
      animation: loadingAnimation 3s infinite;
    }

    @keyframes loadingAnimation {

      100% {
        width: 100vw;
      }
    }
  </style>
</body>
