name: Web Release

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build:
    name: Create Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # A failing test stops the pipeline before anything is built or deployed.
      - name: Run Tests
        run: flutter test

      # --wasm ships the WebAssembly (skwasm) build to browsers that support
      # it, with the regular JS build alongside as the automatic fallback.
      - name: Start Web Release Build
        run: flutter build web --release --wasm --dart-define=GIT_SHA=${GITHUB_SHA::7} --dart-define=GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}

      - name: Add SEO Content to index.html
        run: dart run tool/seo_content.dart build/web/index.html

      - name: Upload Web Build Files
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: ./build/web
          # Keeps web/.htaccess, which serves index.html for path URLs.
          include-hidden-files: true

  web-deploy:
    name: 🎉 Deploy
    needs: [build]
    # Only a push to main publishes. PRs (and manual runs, which can target
    # any branch) stop after the tests and build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Two quick pushes would otherwise run overlapping FTP syncs.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/download-artifact@v4
        with:
          name: web-release
          path: ./build/web

      # Path URLs (`/cv`) 404 on the server without it; fails loudly if the
      # artifact round-trip ever drops hidden files again.
      - name: 🔎 Check .htaccess
        run: test -f ./build/web/.htaccess

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          local-dir: ./build/web/
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public_html/
