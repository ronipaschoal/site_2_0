name: a11y_kit
description: >-
  Accessible building blocks for Flutter on web, Android and iOS: links and
  buttons that behave natively, headings, reduce-motion helpers,
  announcements, and fixes for Flutter Web's accessibility DOM.
version: 0.1.0
publish_to: none # Remove once the API settles and it's ready for pub.dev.

topics:
  - accessibility
  - a11y
  - semantics
  - web

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Only used by `package:a11y_kit/testing.dart`; apps that never import it
  # don't ship any test code.
  flutter_test:
    sdk: flutter
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
